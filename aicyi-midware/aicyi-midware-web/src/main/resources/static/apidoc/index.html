<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>API文档加载中</title>
    <link rel="stylesheet" href="layui/css/layui.css">
    <link rel="stylesheet" href="assets/css/swagger-ui.css">
</head>
<body>
<div class="layui-layout layui-layout-admin">
    <div class="layui-header header header-top">
        <div class="layui-main">
            <a class="logo" href="javascript:;"><img src="assets/img/logo.png" alt="logo"/></a>
        </div>
        <!--
          顶栏控件自左向右：分组 -> Server -> Token -> 接口搜索 -> 文档地址。
          分组与 Server 由文档驱动，加载后才有内容；分组仅在文档源为 springdoc 的
          /v3/api-docs 端点时可用（分组清单来自 /v3/api-docs/swagger-config 的 urls）。
        -->
        <div class="header-bar">
            <div class="layui-form bar-item bar-group" id="barGroup" style="display:none;">
                <select id="selGroup" lay-filter="doc-group"></select>
            </div>
            <div class="layui-form bar-item bar-server" id="barServer" style="display:none;">
                <select id="selServer" lay-filter="doc-server"></select>
            </div>
            <div class="layui-form bar-item bar-token">
                <input id="iptToken" type="text" placeholder="Bearer Token" autocomplete="off" class="layui-input"/>
                <i class="layui-icon btn-savetoken">&#x1005;</i>
            </div>
            <div class="layui-form bar-item api-quick"></div>
            <div class="layui-form bar-item api-url">
                <input id="iptApiUrl" type="url" placeholder="文档地址，默认：本站 /v3/api-docs" autocomplete="off" class="layui-input"/>
                <i class="layui-icon btn-clearurl">&#x1006;</i>
                <i class="layui-icon btn-gourl">&#x1002;</i>
            </div>
        </div>
    </div>
    <div class="api-main"></div>
</div>
<script src="layui/layui.js"></script>
<script src="assets/js/swagger-ui.js"></script>
</body>
</html>
